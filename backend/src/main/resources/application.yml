server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: clinora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clinora}
    username: ${POSTGRES_USER:clinora}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:clinora}
    password: ${RABBITMQ_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${PATIENT_REPORT_MAX_FILE_SIZE:20MB}
      max-request-size: ${PATIENT_REPORT_MAX_REQUEST_SIZE:21MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

clinora:
  auth:
    issuer: ${AUTH_JWT_ISSUER:clinora-ai}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:7d}
    email-verification-ttl: ${AUTH_EMAIL_VERIFICATION_TTL:24h}
    password-reset-ttl: ${AUTH_PASSWORD_RESET_TTL:30m}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    jwt-secret: ${JWT_SECRET:dev-only-clinora-jwt-secret-change-me-32-bytes}
    rate-limit-key-secret: ${RATE_LIMIT_KEY_SECRET:dev-only-clinora-rate-limit-key-change-me}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    rate-limits:
      registration-ip:
        limit: ${AUTH_RATE_LIMIT_REGISTRATION_IP_LIMIT:5}
        window: ${AUTH_RATE_LIMIT_REGISTRATION_IP_WINDOW:1h}
      registration-email:
        limit: ${AUTH_RATE_LIMIT_REGISTRATION_EMAIL_LIMIT:3}
        window: ${AUTH_RATE_LIMIT_REGISTRATION_EMAIL_WINDOW:1h}
      login-ip:
        limit: ${AUTH_RATE_LIMIT_LOGIN_IP_LIMIT:5}
        window: ${AUTH_RATE_LIMIT_LOGIN_IP_WINDOW:1m}
      login-email:
        limit: ${AUTH_RATE_LIMIT_LOGIN_EMAIL_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_LOGIN_EMAIL_WINDOW:15m}
      forgot-password-ip:
        limit: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_IP_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_IP_WINDOW:1h}
      forgot-password-email:
        limit: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_EMAIL_LIMIT:3}
        window: ${AUTH_RATE_LIMIT_FORGOT_PASSWORD_EMAIL_WINDOW:1h}
      resend-verification-ip:
        limit: ${AUTH_RATE_LIMIT_RESEND_VERIFICATION_IP_LIMIT:10}
        window: ${AUTH_RATE_LIMIT_RESEND_VERIFICATION_IP_WINDOW:1h}
      resend-verification-email:
        limit: ${AUTH_RATE_LIMIT_RESEND_VERIFICATION_EMAIL_LIMIT:3}
        window: ${AUTH_RATE_LIMIT_RESEND_VERIFICATION_EMAIL_WINDOW:1h}
      refresh-ip:
        limit: ${AUTH_RATE_LIMIT_REFRESH_IP_LIMIT:120}
        window: ${AUTH_RATE_LIMIT_REFRESH_IP_WINDOW:1h}
  system-admin:
    email: ${SYSTEM_ADMIN_EMAIL:}
    password: ${SYSTEM_ADMIN_PASSWORD:}
    first-name: ${SYSTEM_ADMIN_FIRST_NAME:}
    last-name: ${SYSTEM_ADMIN_LAST_NAME:}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    provider: ${EMAIL_PROVIDER:unconfigured}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    from: ${MAIL_FROM:Clinora AI <noreply@example.invalid>}
    api-base-url: ${EMAIL_API_BASE_URL:https://api.resend.com}
    api-key: ${RESEND_API_KEY:}
  access-applications:
    email-verification-ttl: ${APPLICATION_EMAIL_VERIFICATION_TTL:24h}
    portal-link-ttl: ${APPLICATION_PORTAL_LINK_TTL:30m}
    account-activation-ttl: ${APPLICATION_ACCOUNT_ACTIVATION_TTL:48h}
    session-ttl: ${APPLICATION_SESSION_TTL:8h}
    cookie-secure: ${APPLICATION_COOKIE_SECURE:false}
    cookie-same-site: ${APPLICATION_COOKIE_SAME_SITE:Lax}
    max-document-size: ${APPLICATION_MAX_DOCUMENT_SIZE:10MB}
    interview-default-duration: ${APPLICATION_INTERVIEW_DEFAULT_DURATION:30m}
    interview-reminder-offsets: ${APPLICATION_INTERVIEW_REMINDER_OFFSETS:24h,1h}
    interview-reminder-scan-delay-ms: ${APPLICATION_INTERVIEW_REMINDER_SCAN_DELAY_MS:60000}
    rate-limits:
      create-ip:
        limit: ${APPLICATION_RATE_LIMIT_CREATE_IP_LIMIT:10}
        window: ${APPLICATION_RATE_LIMIT_CREATE_IP_WINDOW:1h}
      create-email:
        limit: ${APPLICATION_RATE_LIMIT_CREATE_EMAIL_LIMIT:4}
        window: ${APPLICATION_RATE_LIMIT_CREATE_EMAIL_WINDOW:1h}
      verify-ip:
        limit: ${APPLICATION_RATE_LIMIT_VERIFY_IP_LIMIT:30}
        window: ${APPLICATION_RATE_LIMIT_VERIFY_IP_WINDOW:1h}
      access-link-ip:
        limit: ${APPLICATION_RATE_LIMIT_ACCESS_LINK_IP_LIMIT:10}
        window: ${APPLICATION_RATE_LIMIT_ACCESS_LINK_IP_WINDOW:1h}
      access-link-email:
        limit: ${APPLICATION_RATE_LIMIT_ACCESS_LINK_EMAIL_LIMIT:8}
        window: ${APPLICATION_RATE_LIMIT_ACCESS_LINK_EMAIL_WINDOW:1h}
      session-ip:
        limit: ${APPLICATION_RATE_LIMIT_SESSION_IP_LIMIT:30}
        window: ${APPLICATION_RATE_LIMIT_SESSION_IP_WINDOW:1h}
      upload-application:
        limit: ${APPLICATION_RATE_LIMIT_UPLOAD_APPLICATION_LIMIT:30}
        window: ${APPLICATION_RATE_LIMIT_UPLOAD_APPLICATION_WINDOW:1h}
      submit-application:
        limit: ${APPLICATION_RATE_LIMIT_SUBMIT_APPLICATION_LIMIT:10}
        window: ${APPLICATION_RATE_LIMIT_SUBMIT_APPLICATION_WINDOW:1h}
  services:
    ocr-url: ${OCR_SERVICE_URL:http://localhost:8000}
    ai-url: ${AI_SERVICE_URL:http://localhost:8001}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:clinora-medical-reports}
    access-key: ${S3_ACCESS_KEY:clinora-minio}
    secret-key: ${S3_SECRET_KEY:change-me-minio}
    path-style: ${S3_PATH_STYLE:true}
    auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}
    max-file-size: ${PATIENT_REPORT_MAX_FILE_SIZE:20MB}
    application:
      endpoint: ${S3_APPLICATION_ENDPOINT:http://localhost:9000}
      region: ${S3_APPLICATION_REGION:us-east-1}
      bucket: ${S3_APPLICATION_BUCKET:clinora-access-documents}
      access-key: ${S3_APPLICATION_ACCESS_KEY:clinora-minio}
      secret-key: ${S3_APPLICATION_SECRET_KEY:change-me-minio}
      path-style: ${S3_APPLICATION_PATH_STYLE:true}
      auto-create-bucket: ${S3_APPLICATION_AUTO_CREATE_BUCKET:true}
  ai:
    hf-token: ${HF_TOKEN:}
    hf-model: ${HF_MODEL:}
