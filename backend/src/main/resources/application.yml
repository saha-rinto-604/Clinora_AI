server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: clinora-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/clinora}
    username: ${POSTGRES_USER:clinora}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:clinora}
    password: ${RABBITMQ_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

clinora:
  services:
    ocr-url: ${OCR_SERVICE_URL:http://localhost:8000}
    ai-url: ${AI_SERVICE_URL:http://localhost:8001}
  storage:
    endpoint: ${S3_ENDPOINT:http://object-storage-placeholder}
    region: ${S3_REGION:local}
    bucket: ${S3_BUCKET:clinora-medical-reports}
  ai:
    hf-token: ${HF_TOKEN:}
    hf-model: ${HF_MODEL:}
