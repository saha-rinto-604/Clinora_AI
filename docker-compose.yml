services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinora}
      POSTGRES_USER: ${POSTGRES_USER:-clinora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinora-private

  rabbitmq:
    image: rabbitmq:3.13-management
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
             rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-clinora}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - clinora-private

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinora-private


  minio:
    image: quay.io/minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clinora-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - clinora-minio-data:/data
    networks:
      - clinora-private

  backend:
    build:
      context: ./backend
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-clinora}
      POSTGRES_USER: ${POSTGRES_USER:-clinora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_STOMP_PORT: 61613
      RABBITMQ_USER: ${RABBITMQ_USER:-clinora}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OCR_SERVICE_URL: http://ocr-service:8000
      AI_SERVICE_URL: http://ai-service:8001
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-clinora-ai}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-15m}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-7d}
      JWT_SECRET: ${JWT_SECRET:-dev-only-clinora-jwt-secret-change-me-32-bytes}
      RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:-dev-only-clinora-rate-limit-key-change-me}
      BCRYPT_STRENGTH: ${BCRYPT_STRENGTH:-12}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-}
      SYSTEM_ADMIN_PASSWORD: ${SYSTEM_ADMIN_PASSWORD:-}
      SYSTEM_ADMIN_FIRST_NAME: ${SYSTEM_ADMIN_FIRST_NAME:-}
      SYSTEM_ADMIN_LAST_NAME: ${SYSTEM_ADMIN_LAST_NAME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:5173}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-unconfigured}
      MAIL_FROM: ${MAIL_FROM:-Clinora AI <noreply@example.invalid>}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_API_BASE_URL: ${EMAIL_API_BASE_URL:-https://api.resend.com}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-clinora-medical-reports}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-clinora-minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_PATH_STYLE: true
      S3_AUTO_CREATE_BUCKET: true
      PATIENT_REPORT_MAX_FILE_SIZE: ${PATIENT_REPORT_MAX_FILE_SIZE:-20MB}
      PATIENT_REPORT_MAX_REQUEST_SIZE: ${PATIENT_REPORT_MAX_REQUEST_SIZE:-21MB}
      S3_APPLICATION_ENDPOINT: http://minio:9000
      S3_APPLICATION_REGION: ${S3_APPLICATION_REGION:-us-east-1}
      S3_APPLICATION_BUCKET: ${S3_APPLICATION_BUCKET:-clinora-access-documents}
      S3_APPLICATION_ACCESS_KEY: ${MINIO_ROOT_USER:-clinora-minio}
      S3_APPLICATION_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change-me-minio}
      S3_APPLICATION_PATH_STYLE: true
      S3_APPLICATION_AUTO_CREATE_BUCKET: true
      APPLICATION_INTERVIEW_DEFAULT_DURATION: ${APPLICATION_INTERVIEW_DEFAULT_DURATION:-30m}
      APPLICATION_INTERVIEW_REMINDER_OFFSETS: ${APPLICATION_INTERVIEW_REMINDER_OFFSETS:-24h,1h}
      APPLICATION_INTERVIEW_REMINDER_SCAN_DELAY_MS: ${APPLICATION_INTERVIEW_REMINDER_SCAN_DELAY_MS:-60000}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - clinora-private

  frontend:
    build:
      context: ./frontend
    environment:
      # Local Compose always routes browser API calls through Vite's relative /api proxy.
      VITE_API_BASE_URL: /api/v1
      DEV_API_PROXY_TARGET: ${DEV_API_PROXY_TARGET:-http://backend:8080}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - clinora-private

  ocr-service:
    build:
      context: ./ocr-service
    environment:
      OCR_MAX_WORKERS: ${OCR_MAX_WORKERS:-2}
      OCR_JOB_TIMEOUT_SECONDS: ${OCR_JOB_TIMEOUT_SECONDS:-60}
      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB:-50}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-10}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - clinora-private

  ai-service:
    build:
      context: ./ai-service
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MODEL: ${HF_MODEL:-}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-2}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-45}
      AI_MAX_RETRY_ATTEMPTS: ${AI_MAX_RETRY_ATTEMPTS:-3}
      AI_RETRY_BASE_DELAY_SECONDS: ${AI_RETRY_BASE_DELAY_SECONDS:-1}
      AI_CIRCUIT_BREAKER_THRESHOLD: ${AI_CIRCUIT_BREAKER_THRESHOLD:-5}
      AI_CIRCUIT_BREAKER_RESET_SECONDS: ${AI_CIRCUIT_BREAKER_RESET_SECONDS:-60}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - clinora-private

networks:
  clinora-private:
    driver: bridge

volumes:
  clinora-minio-data:
